; PlatformIO projekt za AgroTracker ESP32 modul
;
; Ciljna plošča: ESP32 DevKit (WROOM-32) — podpira BLE.
; OPOZORILO: ESP32-S2 NE podpira Bluetooth. Za ta modul uporabi klasični ESP32,
; ali ESP32-S3 / ESP32-C3 (oba podpirata BLE).
;
; Bibliotekama NimBLE-Arduino (lažji BLE stack) in TinyGPSPlus (NMEA parser).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D BLE_DEVICE_NAME="\"AgroESP-01\""
    ; Če želiš test brez strojne opreme (generira fiktivne podatke), odkomentiraj:
    ; -D SIM_MODE=1
    ; ISOBUS/CAN branje traktorja (SN65HVD230 transceiver na GPIO21/22):
    ; -D CAN_ENABLED=1

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
    mikalhart/TinyGPSPlus@^1.0.3
    bblanchon/ArduinoJson@^7.0.4

; ------- Drugi primeri okolij, če imaš drugo ploščo -------

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D BLE_DEVICE_NAME="\"AgroESP-S3\""
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
    mikalhart/TinyGPSPlus@^1.0.3
    bblanchon/ArduinoJson@^7.0.4

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D BLE_DEVICE_NAME="\"AgroESP-C3\""
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
    mikalhart/TinyGPSPlus@^1.0.3
    bblanchon/ArduinoJson@^7.0.4
